name: Build, test, and push Docker app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual runs from the "Run workflow" button in GitHub Actions.
  workflow_dispatch:

jobs:
  build-and-test:
    # Use the latest Ubuntu GitHub-hosted runner.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code so Docker can see the Dockerfile, compose, etc.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (modern Docker builder with caching and multi-platform support).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the image locally to validate that the Dockerfile works.
      - name: Build image (docker build)
        run: docker build -t my-calculator .

      # Step 4: Start the app using docker compose, mapping port 8080 -> 80 in the container.
      - name: Start app with docker compose
        run: docker compose up --build -d

      # Step 5: Wait until the app is reachable on http://localhost:8080 or fail the job.
      - name: Wait for container to be ready
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      # Step 6: Show running containers for easier debugging in the workflow logs.
      - name: Show running containers
        run: docker ps

      # Step 7: Log in to Docker Hub using repository secrets.
      # You must define DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in
      # Settings -> Secrets and variables -> Actions.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 8: Build and push the image to Docker Hub if tests succeeded.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-calculator:latest

      # Step 9: Always stop and remove containers created by docker compose.
      - name: Stop containers
        if: always()
        run: docker compose down

