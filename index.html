<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top left, #facc15 0, transparent 55%),
        radial-gradient(circle at bottom right, #0f172a 0, #020617 55%);
      color: #e5e7eb;
    }

    .layout-shell {
      max-width: 820px;
      width: 100%;
      padding: 1.75rem 2rem;
      border-radius: 1.5rem;
      background: rgba(15, 23, 42, 0.85);
      box-shadow:
        0 30px 80px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(20px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      gap: 1rem;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.18rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(250, 204, 21, 0.55);
      color: #e5e7eb;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
    }

    .layout {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 14px 30px rgba(15, 23, 42, 0.95));
    }

    .calculator {
      background: radial-gradient(circle at 0 0, #020617, #020617 52%, #111827);
      padding: 1.6rem 1.5rem 1.8rem;
      border-radius: 1.3rem;
      box-shadow:
        0 22px 60px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.25);
      width: 320px;
    }

    .display {
      background: radial-gradient(circle at 0 0, #22c55e33, #020617 60%);
      border-radius: 0.9rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1.05rem;
      text-align: right;
      color: #e5e7eb;
      box-shadow:
        inset 0 0 0 1px rgba(148, 163, 184, 0.4),
        0 18px 35px rgba(15, 23, 42, 0.8);
    }

    .display-small {
      min-height: 20px;
      font-size: 0.8rem;
      color: #9ca3af;
      word-wrap: break-word;
    }

    .display-main {
      min-height: 42px;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
      overflow-x: auto;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55rem;
    }

    button {
      border: none;
      border-radius: 0.9rem;
      padding: 0.8rem 0;
      font-size: 1rem;
      font-weight: 550;
      cursor: pointer;
      transition:
        transform 0.08s ease,
        box-shadow 0.12s ease,
        background-color 0.15s ease,
        color 0.15s ease,
        border-color 0.12s ease;
      box-shadow:
        0 10px 22px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(30, 64, 175, 0.25);
      color: #e5e7eb;
      border: 1px solid transparent;
    }

    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow:
        0 4px 10px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(30, 64, 175, 0.2);
    }

    .btn-operator {
      background: radial-gradient(circle at 0 0, #1d4ed8, #0f172a 75%);
      border-color: rgba(59, 130, 246, 0.7);
    }

    .btn-operator:hover {
      background: radial-gradient(circle at 0 0, #2563eb, #020617 75%);
      box-shadow:
        0 16px 30px rgba(30, 64, 175, 0.85),
        0 0 0 1px rgba(37, 99, 235, 0.85);
    }

    .btn-equals {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      grid-column: span 2;
      border-color: rgba(34, 197, 94, 0.9);
    }

    .btn-equals:hover {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      box-shadow:
        0 16px 32px rgba(22, 163, 74, 0.9),
        0 0 0 1px rgba(34, 197, 94, 0.9);
    }

    .btn-clear {
      background: radial-gradient(circle at 0 0, #991b1b, #0b1120 80%);
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.75);
    }

    .btn-clear:hover {
      background: radial-gradient(circle at 0 0, #b91c1c, #020617 80%);
    }

    .btn-number {
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
    }

    .btn-number:hover {
      background: rgba(30, 64, 175, 0.7);
    }

    .btn-zero {
      grid-column: span 2;
    }

    .btn-misc {
      background: rgba(15, 23, 42, 0.88);
      color: #cbd5f5;
    }

    .btn-misc:hover {
      background: rgba(30, 64, 175, 0.7);
    }

    @media (max-width: 720px) {
      .layout-shell {
        padding: 1.4rem 1.3rem 1.6rem;
      }

      .header {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 0.9rem;
      }

      .layout {
        flex-direction: column;
        gap: 1.7rem;
      }

      .logo {
        width: 115px;
        height: 115px;
      }

      .calculator {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="layout-shell">
    <div class="header">
      <div class="title-group">
        <div class="title">Department of Information Technology</div>
        <div class="subtitle">Simple web calculator for everyday use</div>
      </div>
      <span class="badge">
        <span class="badge-dot"></span>
        Live • Ready
      </span>
    </div>

    <div class="layout">
      <img
        class="logo"
        src="images.jpg"
        alt="Department of Information Technology logo"
      />

      <div class="calculator">
        <div class="display">
          <div id="history" class="display-small"></div>
          <div id="result" class="display-main">0</div>
        </div>
        <div class="keys">
          <button class="btn-clear" data-action="clear">AC</button>
          <button class="btn-misc" data-action="backspace">⌫</button>
          <button class="btn-misc" data-action="sign">±</button>
          <button class="btn-operator" data-operator="/">÷</button>

          <button class="btn-number" data-number="7">7</button>
          <button class="btn-number" data-number="8">8</button>
          <button class="btn-number" data-number="9">9</button>
          <button class="btn-operator" data-operator="*">×</button>

          <button class="btn-number" data-number="4">4</button>
          <button class="btn-number" data-number="5">5</button>
          <button class="btn-number" data-number="6">6</button>
          <button class="btn-operator" data-operator="-">−</button>

          <button class="btn-number" data-number="1">1</button>
          <button class="btn-number" data-number="2">2</button>
          <button class="btn-number" data-number="3">3</button>
          <button class="btn-operator" data-operator="+">+</button>

          <button class="btn-number btn-zero" data-number="0">0</button>
          <button class="btn-misc" data-action="decimal">.</button>
          <button class="btn-equals" data-action="equals">=</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const historyEl = document.getElementById("history");
      const resultEl = document.getElementById("result");
      const keys = document.querySelector(".keys");

      let firstOperand = null;
      let operator = null;
      let waitingForSecondOperand = false;

      function inputNumber(num) {
        const current = resultEl.textContent === "0" || waitingForSecondOperand
          ? ""
          : resultEl.textContent;
        resultEl.textContent = current + num;
        waitingForSecondOperand = false;
      }

      function inputDecimal() {
        if (waitingForSecondOperand) {
          resultEl.textContent = "0.";
          waitingForSecondOperand = false;
          return;
        }
        if (!resultEl.textContent.includes(".")) {
          resultEl.textContent += ".";
        }
      }

      function clearAll() {
        firstOperand = null;
        operator = null;
        waitingForSecondOperand = false;
        resultEl.textContent = "0";
        historyEl.textContent = "";
      }

      function backspace() {
        if (waitingForSecondOperand) return;
        const current = resultEl.textContent;
        if (current.length <= 1) {
          resultEl.textContent = "0";
        } else {
          resultEl.textContent = current.slice(0, -1);
        }
      }

      function toggleSign() {
        if (resultEl.textContent === "0") return;
        if (resultEl.textContent.startsWith("-")) {
          resultEl.textContent = resultEl.textContent.slice(1);
        } else {
          resultEl.textContent = "-" + resultEl.textContent;
        }
      }

      function calculate(first, second, op) {
        const a = parseFloat(first);
        const b = parseFloat(second);
        if (isNaN(a) || isNaN(b)) return second;
        switch (op) {
          case "+":
            return a + b;
          case "-":
            return a - b;
          case "*":
            return a * b;
          case "/":
            return b === 0 ? "Error" : a / b;
          default:
            return b;
        }
      }

      function handleOperator(nextOperatorSymbol) {
        const inputValue = resultEl.textContent;

        if (firstOperand === null) {
          firstOperand = inputValue;
        } else if (!waitingForSecondOperand && operator) {
          const result = calculate(firstOperand, inputValue, operator);
          resultEl.textContent =
            typeof result === "number"
              ? String(parseFloat(result.toFixed(8)))
              : result;
          firstOperand = result;
        }

        operator = nextOperatorSymbol;
        waitingForSecondOperand = true;

        historyEl.textContent =
          typeof firstOperand === "number" || typeof firstOperand === "string"
            ? firstOperand + " " + nextOperatorSymbol
            : "";
      }

      function handleEquals() {
        if (operator === null || waitingForSecondOperand) return;
        const secondOperand = resultEl.textContent;
        const result = calculate(firstOperand, secondOperand, operator);

        const expression = firstOperand + " " + operator + " " + secondOperand;
        historyEl.textContent = expression + " =";

        resultEl.textContent =
          typeof result === "number"
            ? String(parseFloat(result.toFixed(8)))
            : result;

        firstOperand = result;
        operator = null;
        waitingForSecondOperand = true;
      }

      keys.addEventListener("click", (event) => {
        const button = event.target;
        if (!button.matches("button")) return;

        const number = button.getAttribute("data-number");
        const op = button.getAttribute("data-operator");
        const action = button.getAttribute("data-action");

        if (number !== null) {
          inputNumber(number);
          return;
        }

        if (op !== null) {
          handleOperator(op);
          return;
        }

        switch (action) {
          case "decimal":
            inputDecimal();
            break;
          case "clear":
            clearAll();
            break;
          case "backspace":
            backspace();
            break;
          case "sign":
            toggleSign();
            break;
          case "equals":
            handleEquals();
            break;
        }
      });

      // Optional: keyboard support for basic keys
      window.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") {
          inputNumber(e.key);
        } else if (e.key === ".") {
          inputDecimal();
        } else if (["+", "-", "*", "/"].includes(e.key)) {
          handleOperator(e.key);
        } else if (e.key === "Enter" || e.key === "=") {
          e.preventDefault();
          handleEquals();
        } else if (e.key === "Backspace") {
          backspace();
        } else if (e.key.toLowerCase() === "c") {
          clearAll();
        }
      });
    })();
  </script>
</body>
</html>
